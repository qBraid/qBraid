name: Cross-Repo Integration Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number in this repo to post results to (optional)'
        type: string
        default: ''
      qbraid_branch:
        description: 'qBraid SDK branch (leave empty to use current default branch)'
        type: string
        default: ''
      qbraid_core_branch:
        description: 'qbraid-core branch (leave empty to use release version)'
        type: string
        default: ''
      pyqasm_branch:
        description: 'pyqasm branch (leave empty to use release version)'
        type: string
        default: ''

permissions:
  contents: read

env:
  QBRAID_BRANCH: ${{ inputs.qbraid_branch }}
  QBRAID_CORE_BRANCH: ${{ inputs.qbraid_core_branch }}
  PYQASM_BRANCH: ${{ inputs.pyqasm_branch }}

jobs:
  # CROSS_REPO_TOKEN reaches only this job and the report job, and neither installs
  # anything. The test job installs about 250 unpinned packages, so it must not hold
  # the token: even a checkout with persist-credentials: false gets the token again
  # in its post step, which runs after those installs. The token is a secret of the
  # cross-repo environment, so a repository admin approves each job that uses it.
  #
  # qbraid-core is private, but any signed-in user can download this repository's
  # artifacts. So the artifact is encrypted with QBRAID_CORE_ARTIFACT_KEY, and the
  # cleanup job deletes it once the tests pass. The key grants no repository access. It
  # is a secret of cross-repo for this job and of cross-repo-artifact, which has no
  # reviewers, for the test job. The test job enters cross-repo-artifact only when a
  # qbraid-core branch is given, so other runs never get the key. A one-time key in
  # a job output does not work: GitHub drops masked outputs, and the next job prints
  # unmasked ones in its public log.
  fetch-qbraid-core:
    # Skipped, with no approval to wait for, when no qbraid-core branch is given
    if: ${{ inputs.qbraid_core_branch != '' }}
    runs-on: ubuntu-latest
    environment: cross-repo

    steps:
      - name: Checkout qbraid-core branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qBraid/qbraid-core
          ref: ${{ inputs.qbraid_core_branch }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: qbraid-core
          persist-credentials: false

      - name: Pack and encrypt qbraid-core branch
        env:
          QBRAID_CORE_ARTIFACT_KEY: ${{ secrets.QBRAID_CORE_ARTIFACT_KEY }}
        run: |
          set -o pipefail
          # Without the key, openssl would encrypt with an empty password
          if [ -z "$QBRAID_CORE_ARTIFACT_KEY" ]; then
            echo "::error::QBRAID_CORE_ARTIFACT_KEY is not set"
            exit 1
          fi
          tar -czf - -C qbraid-core --exclude=.git . \
            | openssl enc -aes-256-cbc -pbkdf2 -pass env:QBRAID_CORE_ARTIFACT_KEY \
              -out "$RUNNER_TEMP/qbraid-core.tar.gz.enc"

      - name: Upload qbraid-core branch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qbraid-core-source
          path: ${{ runner.temp }}/qbraid-core.tar.gz.enc
          retention-days: 1

  cross-repo-test:
    needs: fetch-qbraid-core
    # needs alone would skip this job when fetch-qbraid-core is skipped
    if: ${{ !cancelled() && (needs.fetch-qbraid-core.result == 'success' || needs.fetch-qbraid-core.result == 'skipped') }}
    runs-on: ubuntu-latest
    # An empty name runs the job without an environment
    environment: ${{ inputs.qbraid_core_branch != '' && 'cross-repo-artifact' || '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.qbraid_branch || github.ref }}
          persist-credentials: false

      - name: Download qbraid-core branch
        if: ${{ inputs.qbraid_core_branch != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qbraid-core-source
          path: ${{ runner.temp }}/qbraid-core-source

      - name: Decrypt and unpack qbraid-core branch
        if: ${{ inputs.qbraid_core_branch != '' }}
        env:
          QBRAID_CORE_ARTIFACT_KEY: ${{ secrets.QBRAID_CORE_ARTIFACT_KEY }}
        run: |
          set -o pipefail
          if [ -z "$QBRAID_CORE_ARTIFACT_KEY" ]; then
            echo "::error::QBRAID_CORE_ARTIFACT_KEY is not set"
            exit 1
          fi
          mkdir -p _siblings/qbraid-core
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:QBRAID_CORE_ARTIFACT_KEY \
              -in "$RUNNER_TEMP/qbraid-core-source/qbraid-core.tar.gz.enc" \
            | tar -xzf - -C _siblings/qbraid-core

      - name: Checkout pyqasm branch
        if: ${{ inputs.pyqasm_branch != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qBraid/pyqasm
          ref: ${{ inputs.pyqasm_branch }}
          path: _siblings/pyqasm
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install current repo
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 -m pip install --no-deps -e .

      - name: Override qbraid-core from branch
        if: ${{ inputs.qbraid_core_branch != '' }}
        run: python3 -m pip install --force-reinstall ./_siblings/qbraid-core

      - name: Override pyqasm from branch
        if: ${{ inputs.pyqasm_branch != '' }}
        run: python3 -m pip install --force-reinstall ./_siblings/pyqasm

      - name: Log installed versions
        run: |
          pip show qbraid-core 2>/dev/null | grep -E "^(Name|Version)" || echo "qbraid-core: not installed"
          pip show pyqasm 2>/dev/null | grep -E "^(Name|Version)" || echo "pyqasm: not installed"

      - name: Run tests
        id: tests
        run: |
          pytest tests \
            --tb=line \
            --no-header \
            --junit-xml=report.xml \
            -q 2>&1 | tee pytest-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        env:
          QBRAID_RUN_REMOTE_TESTS: False
          # Runs outside tox, so repeat the unit-tests env's static TLS reservation for
          # qiskit>=2.6 and pyqpanda3.
          GLIBC_TUNABLES: glibc.rtld.optional_static_tls=2048
        continue-on-error: true

      # Upload even if pytest crashes (e.g. import error, segfault) so the report job
      # always has something to summarize
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-repo-test-report
          path: report.xml
          if-no-files-found: ignore
          retention-days: 5

      # Ensure workflow fails after the report is uploaded, not before
      - name: Fail if tests failed
        if: always()
        run: |
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then
            echo "Tests step did not run or produce an exit code"
            exit 1
          elif [ "$EXIT_CODE" != "0" ]; then
            echo "Tests failed with exit code $EXIT_CODE"
            exit 1
          fi

  report:
    needs: cross-repo-test
    # Run even if the tests fail so we always get a summary
    if: always()
    runs-on: ubuntu-latest
    environment: cross-repo

    steps:
      # The workflow's own commit, not the branch under test: this job runs
      # parse_test_report.py with the token, so a branch must not supply the script.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # A missing report (the test job failed before pytest wrote one) is not an
      # error: the script summarizes that case too.
      - name: Download test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-repo-test-report
          # Outside the workspace, so the download cannot overwrite the script below
          path: ${{ runner.temp }}/report
        continue-on-error: true

      - name: Generate summary and post to PR
        run: python .github/scripts/parse_test_report.py
        env:
          REPORT_XML: ${{ runner.temp }}/report/report.xml
          SUMMARY_OUTPUT: test-summary.md
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}

  # Deletes the encrypted source once the tests pass, instead of after the 1-day
  # retention. A separate job, so the delete does not wait for the report approval.
  # After a failure the artifact stays, because "Re-run failed jobs" does not re-run
  # fetch-qbraid-core and the re-run test job needs it. That re-run's cleanup deletes it.
  cleanup:
    needs: cross-repo-test
    if: ${{ !cancelled() && inputs.qbraid_core_branch != '' && needs.cross-repo-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # delete the qbraid-core artifact

    steps:
      - name: Delete qbraid-core artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=qbraid-core-source" \
            --jq '.artifacts[].id' \
            | xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
